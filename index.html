    <link rel="apple-touch-startup-image" media="screen and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (prefers-color-scheme: dark)" href="splash/splash-1320x2868-dark.png" />

    <link rel="apple-touch-startup-image" media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (prefers-color-scheme: dark)" href="splash/splash-1290x2796-dark.png" />
    <script>
      // motyw ustawiony przed pierwszym renderem (bez mignięcia)
      (function () {
        var t = 'system';
        try { t = JSON.parse(localStorage.getItem('cbzc.v1') || '{}').settings.theme || 'system'; } catch (e) {}
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
